<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="robots" content="noindex, nofollow">
  <title>Lens Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Lens<span>Search</span></h1>
    <div id="modelStatus" class="status">モデル未読込</div>
  </header>

  <main>
    <!-- 検索ビュー -->
    <section id="view-search" class="view active">
      <div id="cameraStage" class="stage">
        <video id="video" playsinline muted autoplay hidden></video>
        <div id="noCamera" class="no-camera" hidden>
          <p>ライブカメラを使えません（HTTPS が必要です）。<br>下のボタンからカメラ撮影できます。</p>
        </div>

        <div id="cropWrap" class="crop-wrap" hidden>
          <img id="captured" alt="撮影した画像">
          <div id="cropBox" class="crop-box" hidden></div>
        </div>
      </div>

      <div class="controls">
        <label class="btn ghost" title="写真を選ぶ / 撮る">
          <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
          📷 撮影・選択
        </label>
        <button id="shutter" class="shutter" aria-label="撮影" hidden></button>
        <button id="retake" class="btn ghost" hidden>↺ 撮り直す</button>
        <button id="searchBtn" class="btn primary" hidden>🔍 検索</button>
      </div>
      <p id="hint" class="hint"></p>

      <div id="results" class="results"></div>
    </section>

    <!-- ライブラリビュー -->
    <section id="view-library" class="view">
      <div class="lib-head">
        <div>
          <h2>検索対象ライブラリ</h2>
          <p class="sub"><span id="libCount">0</span> 枚登録済み。ここに登録した画像の中から類似画像を探します。</p>
        </div>
        <div class="lib-actions">
          <label class="btn primary">
            <input id="libInput" type="file" accept="image/*" multiple hidden>
            ＋ 画像を追加
          </label>
          <button id="clearLib" class="btn danger">全削除</button>
        </div>
      </div>
      <div id="progress" class="progress" hidden><div id="progressBar"></div><span id="progressText"></span></div>
      <div id="libGrid" class="grid"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="search" class="active">🔍<span>検索</span></button>
    <button data-view="library">🖼️<span>ライブラリ</span></button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
